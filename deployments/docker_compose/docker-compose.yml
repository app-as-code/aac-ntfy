services:
  # --- Main Application Service ---
  aac-ntfy:
    image: "binwiederhier/ntfy:latest"
    container_name: "aac-ntfy"
    hostname: "aac-ntfy"
    restart: "unless-stopped"

    command:
      - "serve"

    environment:
      TZ: "Europe/Berlin"

    ports:
      - "25125:80/tcp"

    volumes:
      - "/export/docker/aac-ntfy/cache:/var/cache/ntfy"
      - "/export/docker/aac-ntfy/config:/etc/ntfy"

    networks:
      - exposed
      - interconnect
      - secured
      - stack_internal

    labels:
      traefik.enable: "true"
      traefik.http.routers.aac-ntfy.rule: "Host(`aac-ntfy.example.com`)"
      traefik.http.routers.aac-ntfy.entrypoints: "websecure"
      traefik.http.routers.aac-ntfy.tls: "true"
      traefik.http.routers.aac-ntfy.tls.certresolver: "ionos"
      traefik.docker.network: "services-secured"
      traefik.http.services.aac-ntfy.loadbalancer.server.port: "80"
      traefik.http.services.aac-ntfy.loadbalancer.server.scheme: "http"
      auto-dns.createWildcard.aac-ntfy: "false"
      auto-dns.customDNS.aac-ntfy: "true"
      auto-dns.customDOMAIN.aac-ntfy: "example.com"
      auto-dns.customHost.aac-ntfy: "aac-ntfy"
      homepage.group: "Kommunikation"
      homepage.name: "Ntfy"
      homepage.href: "https://aac-ntfy.example.com"
      homepage.icon: "ntfy.png"
      homepage.description: "Push Notification Service"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo \u0027\"healthy\"\\s*:\\s*true\u0027 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

    init: true



networks:
  secured:
    name: "services-secured"
    external: true
  exposed:
    name: "services-exposed"
    external: true
  interconnect:
    name: "docker-default"
    external: true
  stack_internal:
    name: "aac-ntfy_stack_internal"
    driver: "bridge"

